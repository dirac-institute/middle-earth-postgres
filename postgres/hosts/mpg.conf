# Per-host settings for mpg (mpg.astro.washington.edu): 8 cores, ~48 GB RAM.
#
# Included from the middle of postgresql.conf: anything here overrides that
# file's defaults, but not the framework settings that come after the include
# (listening, authentication, archiving, preloaded libraries). The file is
# chosen by `hostname -s` and baked into the image; rebuild and recreate the
# db container to apply changes (see DEPLOY.md).
#
# Generated by PGTune, with io_method changed to worker (see below):
# https://pgtune.leopard.in.ua/?dbVersion=18&osType=linux&dbType=dw&cpuNum=8&totalMemory=48&totalMemoryUnit=GB&connectionNum=&hdType=ssd&dbSize=greater_ram

# WARNING (may prevent startup)
# wal_compression = lz4 requires PostgreSQL compiled
# with --with-lz4. Check build support:
# SELECT enumvals FROM pg_settings WHERE name = 'wal_compression';
# (Supported by the postgres:18 image.)
#
# NOTE
# shared_buffers is large: reserve Linux huge pages
# (vm.nr_hugepages) to reduce memory used by page tables
# of each connection. Required number of huge pages
# (with these settings, while the server is stopped):
# postgres -D $PGDATA -C shared_memory_size_in_huge_pages
# (init.sh does this: it computes the count from this config and writes
# /etc/sysctl.d/90-postgres-hugepages.conf. Re-run it after changing
# memory settings here.)
#
# Cost parameters for Data Warehouses on SSDs
# are left at defaults to avoid catastrophic index scan
# selections. Monitor query planner behavior and adjust
# random_page_cost if necessary

# DB Version: 18
# OS Type: Linux
# DB Type: Data warehouse
# Total Memory (RAM): 48 GB
# CPUs num: 8
# Connections num: 100 (not provided, assumed)
# Data Storage: SSD storage
# Total Data Size: More than 3x RAM

max_connections = 100                # restart required
shared_buffers = 12GB                # restart required
effective_cache_size = 36GB
maintenance_work_mem = 6GB
wal_buffers = 16MB                   # restart required
default_statistics_target = 500
random_page_cost = 4
effective_io_concurrency = 200
maintenance_io_concurrency = 200
work_mem = 51MB
wal_compression = lz4
autovacuum_work_mem = 1GB
io_method = worker                   # restart required; io_uring isn't supported on this VM
min_wal_size = 4GB
max_wal_size = 16GB                  # needs free disk space
max_worker_processes = 8             # restart required
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
