# Per-host settings for mpg (mpg.astro.washington.edu): 8 cores, ~46 GB RAM.
#
# Included from the middle of postgresql.conf: anything here overrides that
# file's defaults, but not the framework settings that come after the include
# (listening, authentication, archiving, preloaded libraries). The file is
# chosen by `hostname -s` and baked into the image; rebuild and recreate the
# db container to apply changes (see DEPLOY.md).

# ── Memory ──────────────────────────────────────────────────────────────────
shared_buffers = 8GB            # ~1/6 of RAM
effective_cache_size = 24GB     # planner hint: shared_buffers + likely page cache
maintenance_work_mem = 1GB
work_mem = 32MB
