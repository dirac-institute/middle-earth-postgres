# PostgreSQL server configuration shared by every host. Baked into the image
# together with this host's postgres/hosts/<hostname>.conf; rebuild and
# recreate the db container to apply changes:
#
#   podman compose up -d --build --force-recreate
#
# The file has three parts, and when a setting appears twice the later one
# wins:
#
#   1. Defaults, which a host file may override.
#   2. include 'host.conf': postgres/hosts/<hostname>.conf, picked by
#      `hostname -s` when the image is built (see init.sh).
#   3. Settings the framework depends on (listening, authentication, WAL
#      archiving to pgBackRest, the monitoring extension). They come after
#      the include so a host file cannot change them by accident.
#
# Anything not set in either file is the PostgreSQL default. ALTER SYSTEM is
# disabled (part 3), so these files are the whole configuration.

# ════════════════════════════════════════════════════════════════════════════
# 1. Defaults (override in postgres/hosts/<hostname>.conf)
# ════════════════════════════════════════════════════════════════════════════

# ── Connections ─────────────────────────────────────────────────────────────
max_connections = 200

# ── Memory ──────────────────────────────────────────────────────────────────
# No defaults here: memory depends on the VM, so every host file sets
# shared_buffers, effective_cache_size, maintenance_work_mem and work_mem.

# ── WAL and replication ─────────────────────────────────────────────────────
max_wal_senders = 10
max_replication_slots = 10
max_wal_size = 16GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = zstd

# archive_timeout forces a WAL segment switch at least every 5 minutes on an
# idle server, bounding how much recent work a restore can lose.
archive_timeout = 300

# ── Statement statistics ────────────────────────────────────────────────────
pg_stat_statements.track = top

# ── Logging (stderr -> podman logs) ─────────────────────────────────────────
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = 'authentication'
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_timezone = 'America/Los_Angeles'
timezone = 'America/Los_Angeles'

# ════════════════════════════════════════════════════════════════════════════
# 2. This host's settings
# ════════════════════════════════════════════════════════════════════════════
# Relative to this file's directory: /etc/postgresql/host.conf. A plain
# include (not include_if_exists): PostgreSQL refuses to start without it.
include 'host.conf'

# ════════════════════════════════════════════════════════════════════════════
# 3. Framework settings (after the include, so host files cannot override)
# ════════════════════════════════════════════════════════════════════════════

# ── Listening and authentication ────────────────────────────────────────────
# The container uses host networking, so this is the VM's own port 5432.
# Access is controlled by firewalld (opened by init.sh) and pg_hba.conf.
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# ── WAL archiving (backups) ─────────────────────────────────────────────────
# Every completed WAL segment is pushed to the pgBackRest repository on
# /service/shire. If the push fails, PostgreSQL keeps the segment and
# retries -- WAL piles up in pg_wal but nothing is lost.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'

# ── Statement statistics (monitoring) ───────────────────────────────────────
# pg_stat_statements tracks execution counts and times per normalized query.
# The monitoring endpoint reports them summed per database (query time and
# throughput). The extension is created in the postgres database by
# sync-roles.sh; changing shared_preload_libraries needs a server restart.
shared_preload_libraries = 'pg_stat_statements'

# ── The repo is the configuration ───────────────────────────────────────────
# ALTER SYSTEM would write postgresql.auto.conf in the data directory, which
# PostgreSQL reads after these files and which would silently override them.
# Change postgres/postgresql.conf or postgres/hosts/<hostname>.conf instead.
# (Guards against drift, not against a superuser determined to change it.)
allow_alter_system = off
