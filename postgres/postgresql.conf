# PostgreSQL server configuration. Baked into the image; rebuild and recreate
# the db container to apply changes:
#
#   podman compose up -d --build
#
# Anything not set here is the PostgreSQL default. Per-cluster overrides made
# with ALTER SYSTEM land in postgresql.auto.conf in the data directory and
# take precedence over this file.

# ── Connections ─────────────────────────────────────────────────────────────
# The container uses host networking, so this is the VM's own port 5432.
# Access is controlled by firewalld (opened by init.sh) and pg_hba.conf.
listen_addresses = '*'
port = 5432
max_connections = 200
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# ── Memory ──────────────────────────────────────────────────────────────────
# Sized for the current VM (8 cores, ~46 GB RAM). Revisit if the VM changes.
shared_buffers = 8GB
effective_cache_size = 24GB
maintenance_work_mem = 1GB
work_mem = 32MB

# ── WAL, replication, and archiving ─────────────────────────────────────────
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
max_wal_size = 16GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = zstd

# Every completed WAL segment is pushed to the pgBackRest repository on
# /service/shire. archive_timeout forces a segment switch at least every 5
# minutes on an idle server, bounding how much recent work a restore can lose.
# If the push fails, PostgreSQL keeps the segment and retries -- WAL piles up
# in pg_wal but nothing is lost.
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
archive_timeout = 300

# ── Statement statistics ────────────────────────────────────────────────────
# pg_stat_statements tracks execution counts and times per normalized query.
# The monitoring endpoint reports them summed per database (query time and
# throughput). The extension is created in the postgres database by
# sync-roles.sh; changing shared_preload_libraries needs a server restart.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top

# ── Logging (stderr -> podman logs) ─────────────────────────────────────────
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = 'authentication'
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_timezone = 'America/Los_Angeles'
timezone = 'America/Los_Angeles'
