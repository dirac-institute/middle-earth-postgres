# Client authentication. Baked into the image; rebuild and recreate the db
# container to apply changes.
#
# Access control is deliberately light: who can reach this VM is controlled
# by who is assigned the VM and by firewalld. Every network login uses a
# password (SCRAM), and the passwords live in /service/shire/secrets.
#
# Connections are NOT encrypted (no TLS). SCRAM never sends the password
# itself over the wire, but query traffic is in the clear.

# TYPE  DATABASE        USER            ADDRESS         METHOD

# The Unix socket only exists inside the containers (a podman volume that
# only root on the host can reach). The role-sync and backup tooling use it.
local   all             all                             trust

# Streaming replication (read replicas, pg_basebackup) -- only the
# "replication" role. Quoted so it is a role name, not a keyword.
host    replication     "replication"   0.0.0.0/0       scram-sha-256
host    replication     "replication"   ::/0            scram-sha-256

# Everything else: any role, any database, password required.
host    all             all             0.0.0.0/0       scram-sha-256
host    all             all             ::/0            scram-sha-256
