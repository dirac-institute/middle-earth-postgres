# pgBackRest configuration, shared by the db container (WAL archive-push) and
# the backup container (backups, verify, restore). Baked into the image.
#
# Repository: /service/shire/backups/pgbackrest on the host, mounted at
# /backups. It lives on NFS, off the VM, and together with this git repo is
# everything needed to rebuild the database on a new VM. See BACKUP.md.

[global]
repo1-path=/backups/pgbackrest

# Retention: keep this many full backups (plus the incrementals and WAL that
# depend on them). With weekly fulls that is 1-2 weeks of point-in-time
# recovery. Expired backups and WAL are removed automatically after each
# backup.
repo1-retention-full-type=count
repo1-retention-full=2

# Bundle small files together and store incrementals at block granularity, so
# an incremental only holds the changed blocks of large relation files.
repo1-bundle=y
repo1-block=y

compress-type=zst
compress-level=3
process-max=4

# Start backups with an immediate checkpoint instead of waiting for the next
# scheduled one.
start-fast=y

# Push WAL asynchronously: archive-push hands segments to a background
# process via the spool directory (on /data), so a slow NFS write does not
# stall the PostgreSQL archiver.
archive-async=y
spool-path=/var/lib/postgresql/pgbackrest-spool

# Log to stdout/stderr only -> podman logs.
log-level-console=info
log-level-stderr=off
log-level-file=off

# No delta=y on purpose: without it, pgBackRest refuses to restore into a
# non-empty directory, so a restore can never overwrite an existing cluster.

# archive-push runs once per WAL segment from PostgreSQL's archiver; only log
# problems so the server log is not flooded.
[global:archive-push]
log-level-console=warn

[main]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
